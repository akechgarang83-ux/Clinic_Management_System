<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Medicine Inventory | Clinic Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button:hover {
            background-color: #146c43;
        }

        .cancel-button {
            background-color: #6c757d;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .cancel-button:hover {
            background-color: #5c636a;
        }

        @media (max-width: 600px) {

            .form-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="form-container">

        <h1>Add Medicine Inventory</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="medicine">
                    Medicine
                </label>

                <select
                    id="medicine"
                    name="medicine"
                    required
                >

                    <option value="">
                        Select Medicine
                    </option>

                    {% for medicine in medicines %}

                    <option value="{{ medicine.id }}">
                        {{ medicine.name }}
                        {% if medicine.strength %}
                            - {{ medicine.strength }}
                        {% endif %}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="batch_number">
                    Batch Number
                </label>

                <input
                    type="text"
                    id="batch_number"
                    name="batch_number"
                    maxlength="100"
                    required
                    placeholder="Enter batch number"
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="quantity_received">
                        Quantity Received
                    </label>

                    <input
                        type="number"
                        id="quantity_received"
                        name="quantity_received"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="quantity_available">
                        Quantity Available
                    </label>

                    <input
                        type="number"
                        id="quantity_available"
                        name="quantity_available"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="expiry_date">
                    Expiry Date
                </label>

                <input
                    type="date"
                    id="expiry_date"
                    name="expiry_date"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="purchase_price">
                        Purchase Price
                    </label>

                    <input
                        type="number"
                        id="purchase_price"
                        name="purchase_price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="selling_price">
                        Selling Price
                    </label>

                    <input
                        type="number"
                        id="selling_price"
                        name="selling_price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="supplier">
                    Supplier
                </label>

                <input
                    type="text"
                    id="supplier"
                    name="supplier"
                    maxlength="200"
                    placeholder="Enter supplier name"
                >

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Inventory
                </button>

                <a
                    href="{% url 'medicine_inventory_list' %}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
