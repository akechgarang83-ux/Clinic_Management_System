<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Invoice | Clinic Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px 0;
        }

        .header p {
            margin: 0;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #2c3e50;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .amount-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .amount-section h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        .total-box {
            background-color: #eafaf1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
        }

        .button-group {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .save-button {
            background-color: #27ae60;
        }

        .save-button:hover {
            background-color: #219150;
        }

        .cancel-button {
            background-color: #95a5a6;
        }

        .cancel-button:hover {
            background-color: #7f8c8d;
        }

        .required {
            color: #e74c3c;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Create Invoice</h1>

        <p>
            Create a new patient invoice.
        </p>

    </div>


    <div class="form-container">

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="patient">
                    Patient <span class="required">*</span>
                </label>

                <select
                    name="patient"
                    id="patient"
                    required
                >

                    <option value="">
                        Select Patient
                    </option>

                    {% for patient in patients %}

                    <option value="{{ patient.id }}">

                        {{ patient.patient_number }}
                        -
                        {{ patient.first_name }}
                        {{ patient.last_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="invoice_number">
                    Invoice Number <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="invoice_number"
                    id="invoice_number"
                    placeholder="Example: INV-0001"
                    required
                >

            </div>


            <div class="amount-section">

                <h3>
                    Invoice Charges
                </h3>


                <div class="form-group">

                    <label for="consultation_fee">
                        Consultation Fee
                    </label>

                    <input
                        type="number"
                        name="consultation_fee"
                        id="consultation_fee"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="0.00"
                    >

                </div>


                <div class="form-group">

                    <label for="medicine_charge">
                        Medicine Charge
                    </label>

                    <input
                        type="number"
                        name="medicine_charge"
                        id="medicine_charge"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="0.00"
                    >

                </div>


                <div class="form-group">

                    <label for="other_charge">
                        Other Charge
                    </label>

                    <input
                        type="number"
                        name="other_charge"
                        id="other_charge"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="0.00"
                    >

                </div>


                <div class="total-box">

                    Total amount will be calculated automatically
                    when the invoice is saved.

                </div>

            </div>


            <div class="form-group">

                <label for="amount_paid">
                    Amount Paid
                </label>

                <input
                    type="number"
                    name="amount_paid"
                    id="amount_paid"
                    min="0"
                    step="0.01"
                    value="0"
                    placeholder="0.00"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    placeholder="Enter invoice description or additional notes..."
                ></textarea>

            </div>


            <div class="button-group">

                <button
                    type="submit"
                    class="button save-button"
                >
                    Save Invoice
                </button>

                <a
                    href="{% url 'invoice_list' %}"
                    class="button cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
